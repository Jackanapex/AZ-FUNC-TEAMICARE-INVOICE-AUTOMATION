# Python package
# Create and test a Python package on multiple Python versions.
# Add steps that analyze code, save the dist with the build record, publish to a PyPI-compatible index, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/python

trigger:
  branches:
    include:
    - stg
    - prd
  paths:
    include:
    - '*'

pr:
  branches:
    include:
      - refs/heads/release/*
      - refs/heads/feature/*
      - refs/heads/fix/*
      - refs/heads/pipeline/*
      - refs/heads/dev

variables:
- group: variables_pipeline_app_api_data_ingestion

pool:
  vmImage: ubuntu-latest

stages:
- stage: test_stage
  displayName: test the functions
  condition: and(not(or(failed(), canceled())),
    or(startsWith(variables['System.PullRequest.SourceBranch'], 'refs/heads/feature/'),
    startsWith(variables['System.PullRequest.SourceBranch'], 'refs/heads/pipeline/'),
    startsWith(variables['System.PullRequest.SourceBranch'], 'refs/heads/release/'),
    startsWith(variables['System.PullRequest.SourceBranch'], 'refs/heads/fix/'),
    eq(variables['System.PullRequest.SourceBranch'], 'refs/heads/dev')))
  jobs:
  
  - job: test_job_dev
    displayName: 'Dry-run the functions against dev endpoints'
    condition: not(
      or(startsWith(variables['System.PullRequest.SourceBranch'], 'refs/heads/release/'), 
        and(startsWith(variables['System.PullRequest.SourceBranch'], 'refs/heads/fix/'), 
          eq(variables['System.PullRequest.TargetBranch'], 'refs/heads/prd'))))
    strategy:
      matrix:
        Python3x:
          python.version: '3.11'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(python.version)'
        addToPath: true
      displayName: 'Use Python $(python.version)'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt --upgrade
      displayName: 'Install dependencies'

    - script: |
        pip install pytest pytest-azurepipelines
        pytest
      displayName: 'pytest'
      env:
        is_local_dev: false
        AzureWebJobsStorage: $(AzureWebJobsStorage)
        FUNCTIONS_WORKER_RUNTIME: $(FUNCTIONS_WORKER_RUNTIME)
        AzureWebJobsFeatureFlags: $(AzureWebJobsFeatureFlags)
        livehire_client_id: $(livehire_client_id)
        livehire_client_secret: $(livehire_client_secret)
        livehire_authentication_url: $(livehire_authentication_url)
        livehire_endpoint_analytics_activities: $(livehire_endpoint_analytics_activities)
        livehire_endpoint_analytics_job_vacancies: $(livehire_endpoint_analytics_job_vacancies)
