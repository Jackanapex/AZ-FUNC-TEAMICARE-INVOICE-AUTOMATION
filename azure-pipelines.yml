- stage: build_stage
  displayName: 'Artifact Build Stage'
  condition: and(
    not(eq(variables['Build.Reason'], 'PullRequest')),
    in(variables['Build.SourceBranch'], 'refs/heads/prd', 'refs/heads/stg'))
  jobs:  
  - job: build_job_dev
    displayName: 'Build the function artifact to be deployed in dev'
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/stg')
    steps:
    - task: UsePythonVersion@0
      displayName: 'Use Python 3.11'
      inputs:
        versionSpec: '3.11'
        addToPath: true
    - task: Bash@3
      displayName: 'Install requirements'
      inputs:
        targetType: 'inline'
        script: |
          if [ -f extensions.csproj ]
          then
              dotnet build extensions.csproj --output ./bin
          fi
          pip install --target="./.python_packages/lib/site-packages" -r ./requirements.txt --upgrade
    - task: CopyFiles@2
      displayName: "Copy files required for build"
      inputs:
        SourceFolder: "$(System.DefaultWorkingDirectory)"
        Contents: |
          **/*
          !*.md
          !*.yml
          !.git/**
          !.gitignore
        TargetFolder: "$(System.DefaultWorkingDirectory)/tmp"
    - task: ArchiveFiles@2
      displayName: "Archive files"
      inputs:
        rootFolderOrFile: "$(System.DefaultWorkingDirectory)/tmp"
        includeRootFolder: false
        archiveFile: "$(System.DefaultWorkingDirectory)/build$(Build.BuildId).zip"
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/build$(Build.BuildId).zip'
        artifactName: 'drop'

  - job: build_job_prd
    displayName: 'Build the function artifact to be deployed in prd'
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/prd')
    steps:
    - task: UsePythonVersion@0
      displayName: 'Use Python 3.11'
      inputs:
        versionSpec: '3.11'
        addToPath: true
    - task: Bash@3
      displayName: 'Install requirements'
      inputs:
        targetType: 'inline'
        script: |
          if [ -f extensions.csproj ]
          then
              dotnet build extensions.csproj --output ./bin
          fi
          pip install --target="./.python_packages/lib/site-packages" -r ./requirements.txt --upgrade
    - task: CopyFiles@2
      displayName: "Copy files required for build"
      inputs:
        SourceFolder: "$(System.DefaultWorkingDirectory)"
        Contents: |
          **/*
          !*.md
          !*.yml
          !.git/**
          !.gitignore
        TargetFolder: "$(System.DefaultWorkingDirectory)/tmp"
    - task: ArchiveFiles@2
      displayName: "Archive files"
      inputs:
        rootFolderOrFile: "$(System.DefaultWorkingDirectory)/tmp"
        includeRootFolder: false
        archiveFile: "$(System.DefaultWorkingDirectory)/build$(Build.BuildId).zip"
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/build$(Build.BuildId).zip'
        artifactName: 'drop'
        
- stage: deploy_stage
  displayName: 'Artifact Deploy Stage'
  condition: and(not(or(failed(), canceled())),
    not(eq(variables['Build.Reason'], 'PullRequest')),
    in(variables['Build.SourceBranch'], 'refs/heads/prd', 'refs/heads/stg'))
  jobs:  
  - job: deploy_job_dev
    displayName: 'Deploy the function artifact to dev'
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/stg')
    steps:
    - task: DownloadPipelineArtifact@2
      inputs:
        artifact: drop
        patterns: '**/*.zip'
    - task: AzureFunctionApp@2 # Add this at the end of your file
      inputs:
        runtimeStack: 'PYTHON|3.11'
        azureSubscription: $(azureSubscription_dev)
        appType: $(appType) # default is functionApp
        appName: $(appName_dev)
        package: $(Pipeline.Workspace)/**/*.zip
        deploymentMethod: 'auto' # 'auto' | 'zipDeploy' | 'runFromPackage'. Required. Deployment method. Default: auto.
        #Uncomment the next lines to deploy to a deployment slot
        #Note that deployment slots is not supported for Linux Dynamic SKU
        #deployToSlotOrASE: true
        #resourceGroupName: '<Resource Group Name>'
        #slotName: '<Slot name>'

  - job: deploy_job_prd
    displayName: 'Deploy the function artifact in prd'
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/prd')
    steps:
    - task: DownloadPipelineArtifact@2
      inputs:
        artifact: drop
        patterns: '**/*.zip'
    - task: AzureFunctionApp@2 # Add this at the end of your file
      inputs:
        runtimeStack: 'PYTHON|3.11'
        azureSubscription: $(azureSubscription_prd)
        appType: $(appType) # default is functionApp
        appName: $(appName_prd)
        package: $(Pipeline.Workspace)/**/*.zip
        deploymentMethod: 'auto' # 'auto' | 'zipDeploy' | 'runFromPackage'. Required. Deployment method. Default: auto.
        #Uncomment the next lines to deploy to a deployment slot
        #Note that deployment slots is not supported for Linux Dynamic SKU
        #deployToSlotOrASE: true
        #resourceGroupName: '<Resource Group Name>'
        #slotName: '<Slot name>'